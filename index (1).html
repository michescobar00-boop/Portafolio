<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Michell Huerta Escobar | Desarrollador Web</title>
<meta name="description" content="Portafolio de Michell Huerta Escobar, desarrollador web en Córdoba, Veracruz.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef0f4; --surface:#f8f9fb; --ink:#1f2433; --muted:#5d6478;
  --line:#d5d9e3; --accent:#6b4f8a; --accent-soft:#e4dcee; --accent-ink:#fff;
  --serif:'Spectral',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.65;font-size:17px}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
section{padding:84px 0 12px}
h2{font-family:var(--serif);font-weight:600;font-size:2rem;margin-bottom:28px;letter-spacing:-.01em}

/* Navegación */
header{position:sticky;top:0;z-index:20;background:rgba(238,240,244,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-family:var(--serif);font-weight:600;font-size:1.15rem;text-decoration:none}
nav ul{display:flex;gap:6px;list-style:none}
nav ul a{display:block;padding:8px 12px;text-decoration:none;font-size:.95rem;color:var(--muted);border-radius:999px}
nav ul a:hover,nav ul a.active{background:var(--accent-soft);color:var(--accent)}
.burger{display:none;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer;color:var(--ink)}

/* Hero */
.hero{padding-top:72px;display:grid;grid-template-columns:1.4fr 1fr;gap:56px;align-items:center}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.4rem,6vw,4.2rem);line-height:1.08;letter-spacing:-.02em;margin-bottom:18px}
.hero .role{color:var(--accent);font-weight:500;margin-bottom:18px}
.hero p.lead{font-family:var(--serif);font-size:1.25rem;color:var(--muted);max-width:34ch;margin-bottom:28px;font-style:italic}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;padding:12px 22px;border-radius:999px;font:inherit;font-weight:500;text-decoration:none;cursor:pointer;border:1.5px solid var(--accent);transition:background .2s,color .2s}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:#563d70}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.ghost:hover{background:var(--accent-soft)}
.photo{width:100%;max-width:340px;aspect-ratio:4/5;border-radius:170px 170px 18px 18px;background:var(--accent-soft);overflow:hidden;display:grid;place-items:center;justify-self:center;border:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .ini{font-family:var(--serif);font-size:4rem;color:var(--accent)}

/* Sobre mí */
.about{display:grid;grid-template-columns:1.4fr 1fr;gap:48px}
.about p{margin-bottom:14px;max-width:60ch}
.facts{list-style:none;border-top:1px solid var(--line)}
.facts li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:.97rem}
.facts span:first-child{color:var(--muted)}
.facts a{color:var(--accent)}

/* Habilidades */
.skills{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px 40px}
.skill .top{display:flex;justify-content:space-between;margin-bottom:6px;font-weight:500}
.skill .top small{color:var(--muted);font-weight:400}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;width:0;transition:width 1s ease}
.soft{margin-top:32px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.soft h3{font-size:1rem;font-weight:500;margin-right:6px}
.chip{background:var(--surface);border:1px solid var(--line);padding:5px 14px;border-radius:999px;font-size:.92rem}

/* Proyectos */
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;text-align:left;font:inherit;color:inherit;cursor:pointer;padding:0}
.card:hover{border-color:var(--accent)}
.thumb{aspect-ratio:16/9;display:grid;place-items:center;font-family:var(--serif);font-size:1.6rem;color:#fff;position:relative;overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{font-family:var(--serif);font-size:1.3rem;line-height:1.25}
.card p{color:var(--muted);font-size:.97rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.tags span{background:var(--accent-soft);color:var(--accent);padding:2px 10px;border-radius:99px;font-size:.82rem;font-weight:500}
dialog{border:none;border-radius:16px;max-width:620px;width:calc(100% - 32px);padding:0;background:var(--surface);color:var(--ink);margin:auto}
dialog::backdrop{background:rgba(31,36,51,.55)}
.dlg-body{padding:28px}
.dlg-body h3{font-family:var(--serif);font-size:1.7rem;margin-bottom:12px}
.dlg-body p{margin-bottom:14px;color:var(--muted)}
.dlg-body .tags{margin:0 0 20px}
.dlg-body .thumb{border-radius:10px;margin-bottom:20px}
.close{float:right;background:none;border:1px solid var(--line);border-radius:50%;width:36px;height:36px;font-size:1.1rem;cursor:pointer;color:var(--ink)}
.note{font-size:.88rem;color:var(--muted)}

/* CV y redes */
.cv{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between}
.cv p{max-width:46ch;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:12px}

/* Contacto */
form{display:grid;gap:18px;max-width:560px}
.field label{display:block;font-weight:500;margin-bottom:6px;font-size:.95rem}
.field label em{color:var(--accent);font-style:normal}
input,textarea{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
textarea{min-height:140px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--accent)}
.field.err input,.field.err textarea{border-color:#b3261e}
.msg{color:#b3261e;font-size:.86rem;min-height:1.2em;margin-top:4px}
.ok{background:#e3f1e6;border:1px solid #a9cfb1;color:#1e4a2a;padding:14px 16px;border-radius:10px;display:none}
footer{margin-top:84px;border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:.92rem}

@media (max-width:760px){
  .burger{display:block}
  nav ul{display:none;position:absolute;top:60px;left:0;right:0;flex-direction:column;background:var(--bg);padding:10px 24px 16px;border-bottom:1px solid var(--line)}
  nav ul.open{display:flex}
  .hero,.about{grid-template-columns:1fr;gap:32px}
  .photo{order:-1;max-width:240px;justify-self:start}
  section{padding-top:64px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bar i{transition:none}}

/* Color y logos */
:root{--c1:#ff7a59;--c2:#14b8a6;--c3:#ffc857;--c4:#4f8cff}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(circle at 95% 4%,#ffd9cf 0,transparent 32%),radial-gradient(circle at 0% 38%,#cdf1ea 0,transparent 30%),radial-gradient(circle at 100% 80%,#dbe6ff 0,transparent 30%)}
h2::after{content:"";display:block;width:64px;height:5px;border-radius:9px;margin-top:10px;background:linear-gradient(90deg,var(--accent),var(--c1),var(--c3))}
.hero .role{display:inline-block;background:var(--c3);color:#3b2f00;padding:4px 14px;border-radius:99px;font-size:.92rem}
.hero h1{background:linear-gradient(100deg,var(--ink) 55%,var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent}
.photo{box-shadow:14px 14px 0 var(--c3),-12px -12px 0 var(--c2);border:3px solid var(--surface)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#8a4fb0);border-color:transparent}
.btn.primary:hover{background:linear-gradient(135deg,#563d70,var(--accent))}
.btn svg{width:18px;height:18px;vertical-align:-3px;margin-right:8px;fill:currentColor}
.btn svg.st{fill:none;stroke:currentColor;stroke-width:2}
.skill{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.skill .top span{display:flex;align-items:center;gap:10px}
.lg{width:28px;height:28px;object-fit:contain}
.tags .lg{width:14px;height:14px}
.tags span{display:inline-flex;align-items:center;gap:5px}
.card{border-top:6px solid var(--pc,var(--accent))}
.chip:nth-child(2){background:#ffe3da;border-color:#ffc4b2}
.chip:nth-child(3){background:#d4f3ee;border-color:#a8e3da}
.chip:nth-child(4){background:#dfe8ff;border-color:#b9ccff}
.chip:nth-child(5){background:#fff0c9;border-color:#ffdf8a}
.facts li:nth-child(1) span:first-child{color:var(--accent)}
.facts li:nth-child(2) span:first-child{color:var(--c1)}
.facts li:nth-child(3) span:first-child{color:#0d9488}
.facts li:nth-child(4) span:first-child{color:var(--c4)}
</style>
</head>

<header>
  <div class="wrap">
    <nav aria-label="Principal">
      <a class="brand" href="#inicio">Michell Huerta</a>
      <button class="burger" id="burger" aria-expanded="false" aria-controls="menu">Menú</button>
      <ul id="menu">
        <li><a href="#inicio">Inicio</a></li>
        <li><a href="#sobre-mi">Sobre mí</a></li>
        <li><a href="#habilidades">Habilidades</a></li>
        <li><a href="#proyectos">Proyectos</a></li>
        <li><a href="#curriculum">Currículum</a></li>
        <li><a href="#contacto">Contacto</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="wrap">
  <!-- RF01 Información personal -->
  <section id="inicio" class="hero">
    <div>
      <p class="role" id="h-role"></p>
      <h1 id="h-name"></h1>
      <p class="lead" id="h-lead"></p>
      <div class="btns">
        <a class="btn primary" href="#proyectos">Ver mis proyectos</a>
        <a class="btn ghost" href="#contacto">Escríbeme</a>
      </div>
    </div>
    <div class="photo" id="photo"></div>
  </section>

  <section id="sobre-mi">
    <h2>Sobre mí</h2>
    <div class="about">
      <div id="about-text"></div>
      <ul class="facts" id="facts"></ul>
    </div>
  </section>

  <!-- RF03 Habilidades -->
  <section id="habilidades">
    <h2>Habilidades</h2>
    <div class="skills" id="skills"></div>
    <div class="soft" id="soft"></div>
  </section>

  <!-- RF04 y RF05 Proyectos -->
  <section id="proyectos">
    <h2>Proyectos</h2>
    <div class="projects" id="projects"></div>
  </section>

  <!-- RF06 Currículum y RF07 Redes -->
  <section id="curriculum">
    <h2>Currículum y redes</h2>
    <div class="cv">
      <p>Descarga mi currículum en PDF o encuéntrame en mis perfiles profesionales.</p>
      <div class="links" id="links"></div>
    </div>
  </section>

  <!-- RF08 Contacto -->
  <section id="contacto">
    <h2>Contacto</h2>
    <form id="form" novalidate>
      <div class="field"><label for="nombre">Nombre <em>*</em></label><input id="nombre" name="nombre" autocomplete="name"><div class="msg"></div></div>
      <div class="field"><label for="correo">Correo electrónico <em>*</em></label><input id="correo" name="correo" type="email" autocomplete="email"><div class="msg"></div></div>
      <div class="field"><label for="telefono">Teléfono</label><input id="telefono" name="telefono" type="tel" autocomplete="tel"><div class="msg"></div></div>
      <div class="field"><label for="mensaje">Mensaje <em>*</em></label><textarea id="mensaje" name="mensaje"></textarea><div class="msg"></div></div>
      <button class="btn primary" type="submit">Enviar mensaje</button>
      <div class="ok" id="ok" role="status"></div>
    </form>
  </section>
</main>

<footer><div class="wrap" id="foot"></div></footer>

<dialog id="dlg" aria-labelledby="dlg-title"><div class="dlg-body" id="dlg-body"></div></dialog>

/* ---------- Logos de tecnologías (Devicon) ---------- */
const LOGO = { HTML:["html5","#e44d26"], CSS:["css3","#2965f1"], JavaScript:["javascript","#f7b500"], Python:["python","#3776ab"], SQL:["mysql","#00758f"], Git:["git","#f05133"] };
const logo = n => LOGO[n] ? `<img class="lg" alt="" src="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/icons/${LOGO[n][0]}/${LOGO[n][0]}-original.svg" onerror="this.remove()">` : "";
const tag = t => `<span>${logo(t)}${t}</span>`;

/* ---------- Utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const iniciales = DATA.nombre.split(" ").filter((_, i) => i < 2).map(p => p[0]).join("");

/* ---------- RF01 Información personal ---------- */
$("#h-role").textContent = DATA.rol;
$("#h-name").textContent = DATA.nombre;
$("#h-lead").textContent = DATA.frase;
const photo = $("#photo");
photo.innerHTML = `<span class="ini" aria-hidden="true">${iniciales}</span>`;
const img = new Image();
img.alt = "Fotografía de " + DATA.nombre;
img.onload = () => { photo.innerHTML = ""; photo.appendChild(img); };
img.src = DATA.foto;

$("#about-text").innerHTML = DATA.sobreMi.map(t => `<p>${t}</p>`).join("");
$("#facts").innerHTML = `
  <li><span>Perfil</span><span>${DATA.rol}</span></li>
  <li><span>Ubicación</span><span>${DATA.ciudad}</span></li>
  <li><span>Correo</span><a href="mailto:${DATA.correo}">${DATA.correo}</a></li>
  <li><span>Teléfono</span><a href="tel:+52${DATA.telefono}">${DATA.telefono}</a></li>`;
$("#foot").textContent = `© ${new Date().getFullYear()} ${DATA.nombre}`;

/* ---------- RF03 Habilidades ---------- */
const nivelTxt = n => n >= 80 ? "Avanzado" : n >= 65 ? "Intermedio" : "Básico";
$("#skills").innerHTML = DATA.habilidades.map(h => `
  <div class="skill">
    <div class="top"><span>${logo(h.n)}${h.n}</span><small>${nivelTxt(h.nivel)}</small></div>
    <div class="bar" role="img" aria-label="${h.n}: ${nivelTxt(h.nivel)}"><i data-w="${h.nivel}" style="background:${(LOGO[h.n]||[0,'var(--accent)'])[1]}"></i></div>
  </div>`).join("");
$("#soft").innerHTML = `<h3>Habilidades blandas</h3>` + DATA.blandas.map(b => `<span class="chip">${b}</span>`).join("");

const barObs = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.querySelectorAll("i").forEach(i => i.style.width = i.dataset.w + "%"); barObs.unobserve(e.target); }
}), { threshold: .3 });
barObs.observe($("#skills"));

/* ---------- RF04 Proyectos ---------- */
const thumb = p => `<div class="thumb" style="background:${p.color}"><span>${p.nombre}</span>${p.imagen ? `<img src="${p.imagen}" alt="Captura de ${p.nombre}" onerror="this.remove()">` : ""}</div>`;
$("#projects").innerHTML = DATA.proyectos.map((p, i) => `
  <button class="card" style="--pc:${p.color}" data-i="${i}" aria-haspopup="dialog">
    ${thumb(p)}
    <div class="body">
      <h3>${p.nombre}</h3>
      <p>${p.corto}</p>
      <div class="tags">${p.tecnologias.map(tag).join("")}</div>
    </div>
  </button>`).join("");

/* ---------- RF05 Detalle de proyecto ---------- */
const dlg = $("#dlg");
$("#projects").addEventListener("click", e => {
  const card = e.target.closest(".card"); if (!card) return;
  const p = DATA.proyectos[card.dataset.i];
  const enlaces = [];
  if (p.repo) enlaces.push(`<a class="btn primary" href="${p.repo}" target="_blank" rel="noopener">Ver repositorio</a>`);
  if (p.demo) enlaces.push(`<a class="btn ghost" href="${p.demo}" target="_blank" rel="noopener">Ver demostración</a>`);
  $("#dlg-body").innerHTML = `
    <button class="close" id="close" aria-label="Cerrar">✕</button>
    ${thumb(p)}
    <h3 id="dlg-title">${p.nombre}</h3>
    <p>${p.largo}</p>
    <div class="tags">${p.tecnologias.map(tag).join("")}</div>
    ${enlaces.length ? `<div class="btns">${enlaces.join("")}</div>` : `<p class="note">El repositorio y la demostración de este proyecto estarán disponibles pronto.</p>`}`;
  dlg.showModal();
  $("#close").onclick = () => dlg.close();
});
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

  GitHub:'<svg viewBox="0 0 24 24"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.3-3.1-.2-.4-.6-1.6 0-3.2 0 0 1-.3 3.4 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.7 1.6.3 2.8.1 3.2.8.8 1.3 1.9 1.3 3.1 0 4.6-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3"/></svg>',
  Correo:'<svg class="st" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
  CV:'<svg class="st" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>'

  `<a class="btn ghost" href="mailto:${DATA.correo}">${ICO.Correo}Correo</a>`;

/* ---------- RF02 Navegación ---------- */
const menu = $("#menu"), burger = $("#burger");
burger.onclick = () => { const o = menu.classList.toggle("open"); burger.setAttribute("aria-expanded", o); };
menu.addEventListener("click", e => { if (e.target.tagName === "A") { menu.classList.remove("open"); burger.setAttribute("aria-expanded", false); } });
const links = [...menu.querySelectorAll("a")];
const secObs = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id));
}), { rootMargin: "-40% 0px -55% 0px" });
document.querySelectorAll("main section").forEach(s => secObs.observe(s));

/* ---------- RF08 Contacto con validación ---------- */
const form = $("#form");
const reglas = {
  nombre:   v => v.trim().length < 2 ? "Escribe tu nombre." : "",
  correo:   v => !v.trim() ? "Escribe tu correo electrónico." : !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim()) ? "Ingresa un correo válido, por ejemplo nombre@correo.com." : "",
  telefono: v => v.trim() && !/^[\d\s+()-]{8,15}$/.test(v.trim()) ? "Ingresa un teléfono válido, solo números." : "",
  mensaje:  v => v.trim().length < 10 ? "Escribe un mensaje de al menos 10 caracteres." : ""
};
function validar(campo) {
  const el = form.elements[campo], f = el.closest(".field"), m = reglas[campo](el.value);
  f.classList.toggle("err", !!m);
  $(".msg", f).textContent = m;
  el.setAttribute("aria-invalid", !!m);
  return !m;
}
Object.keys(reglas).forEach(c => form.elements[c].addEventListener("blur", () => validar(c)));
form.addEventListener("submit", e => {
  e.preventDefault();
  const okAll = Object.keys(reglas).map(validar).every(Boolean);
  if (!okAll) { const bad = form.querySelector(".err input, .err textarea"); bad && bad.focus(); return; }
  const d = Object.fromEntries(new FormData(form));
  const cuerpo = `${d.mensaje}\n\nNombre: ${d.nombre}\nCorreo: ${d.correo}\nTeléfono: ${d.telefono || "No indicado"}`;
  window.location.href = `mailto:${DATA.correo}?subject=${encodeURIComponent("Contacto desde tu portafolio: " + d.nombre)}&body=${encodeURIComponent(cuerpo)}`;
  const ok = $("#ok");
  ok.textContent = "Listo, se abrió tu aplicación de correo con el mensaje. Envíalo desde ahí para que me llegue.";
  ok.style.display = "block";
  form.reset();
});
</script>
